# PVF AI Editor - Docker Compose (Phase 4)
# 使用方式: docker compose --env-file .env.local up -d --build

services:
  # ─── Caddy 反向代理 + 前端静态托管 ───
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      # 域名模式取消注释:
      # - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  # ─── Frontend Builder（构建后输出到共享 volume） ───
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    volumes:
      - frontend_dist:/srv/frontend

  # ─── Tool Relay Service ───
  relay:
    build:
      context: ../relay
      dockerfile: ../deploy/relay/Dockerfile
    environment:
      - RELAY_PORT=9100
      - TOOL_CALL_TIMEOUT=60000
      - DATABASE_URL=postgresql://pvf:${DB_PASSWORD:-pvf_secret_2026}@postgres:5432/pvf_ai_editor
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-true}
    expose:
      - "9100"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=pvf_ai_editor
      - POSTGRES_USER=pvf
      - POSTGRES_PASSWORD=${DB_PASSWORD:-pvf_secret_2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvf -d pvf_ai_editor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  frontend_dist:

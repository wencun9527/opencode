[package]
name = "pvf-ai-editor"
version = "0.1.0"
description = "PVF AI Editor - Tauri v2 + React + Ant Design"
authors = ["you"]
edition = "2021"

[lib]
name = "pvf_ai_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
